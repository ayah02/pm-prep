<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PM Prep – Instructor dashboard</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" defer></script>
<style>
  :root{--brand:#FA9310;--brand-soft:#FFF3E3;--ink:#1F1F1F;--muted:#5E5E5E;--line:#E3E3E3;--card:#F6F6F6;--ok:#2E7D32;--ok-soft:#E8F5E9;--bad:#C62828;--bad-soft:#FDECEA;--radius:14px}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:#fff;font-size:15px;line-height:1.45}
  button{font:inherit;cursor:pointer}
  .topbar{background:var(--ink);color:#fff}
  .topbar .in{max-width:1180px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:12px}
  .mark{width:30px;height:28px;display:grid;place-items:center}
  main{max-width:1180px;margin:0 auto;padding:20px 18px 50px}
  h1{font-size:24px;margin:0 0 4px} h2{font-size:18px;margin:26px 0 10px} h3{font-size:15px;margin:0 0 8px}
  .muted{color:var(--muted)}
  .grid{display:grid;gap:14px} .k4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))} .g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
  .card{background:var(--card);border-radius:var(--radius);padding:16px}
  .card.white{background:#fff;border:1px solid var(--line)}
  .kpi .v{font-size:32px;font-weight:700} .kpi .tgt{font-size:13px;color:var(--muted)}
  .kpi.okb{border-top:6px solid var(--ok)} .kpi.badb{border-top:6px solid var(--bad)} .kpi.neu{border-top:6px solid var(--brand)}
  .btn{border:0;border-radius:10px;padding:9px 16px;font-weight:600;background:var(--brand);color:#1b1b1b;min-height:40px}
  .btn.ghost{background:#fff;border:1.5px solid var(--line)} .btn.dark{background:var(--ink);color:#fff}
  .row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
  label{font-size:13px;font-weight:600;display:block;margin-bottom:4px}
  input,select{padding:8px 10px;border:1.5px solid var(--line);border-radius:9px;font:inherit;background:#fff}
  .bar{height:12px;background:#e6e6e6;border-radius:6px;position:relative;overflow:visible}
  .bar i{display:block;height:100%;border-radius:6px;background:var(--brand)}
  .bar.ok i{background:var(--ok)} .bar.bad i{background:var(--bad)}
  .bar .line{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
  .metric{display:grid;grid-template-columns:1fr auto;gap:4px 10px;margin:10px 0}
  .flag{font-size:12px;font-weight:700;color:var(--bad);margin-inline-start:6px}
  .hist{display:flex;align-items:flex-end;gap:6px;height:160px;padding-top:10px}
  .hist div{flex:1;background:var(--brand);border-radius:6px 6px 0 0;position:relative;min-height:2px}
  .hist div.pass{background:var(--ok)}
  .hist span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:12px;font-weight:600}
  .hlab{display:flex;gap:6px;font-size:11px;color:var(--muted)} .hlab div{flex:1;text-align:center}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{background:#fafafa;position:sticky;top:0;cursor:pointer;user-select:none}
  tr.fl td{background:var(--bad-soft)}
  table.mx td{text-align:center} table.mx td:first-child{text-align:start} table.mx td.lo{background:#fdecea;color:#b3261e} table.mx td.hi{background:#e8f5e9}
  .tablewrap{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:12px}
  .center{display:grid;place-items:center;min-height:50vh}
  .login{max-width:360px;width:100%}
  .err{color:var(--bad);font-size:14px;margin-top:8px;min-height:18px}
  .note{font-size:13px;color:var(--muted)}
  .hide{display:none!important}
  .steps{margin:8px 0 0;padding-inline-start:22px} .steps li{margin:10px 0}
  .ok-msg{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:10px 12px;font-weight:600}
  .bad-msg{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px}
</style>
</head>
<body>
<header class="topbar"><div class="in"><span class="mark"><svg width="30" height="28" viewBox="0 4 88 84" aria-hidden="true"><g fill="#FA9310"><path d="M0 27H51L44 35H0Z"/><path d="M0 43H43L67 19L74 26L47 53H0Z"/><polygon points="87,5 58,11 81,34"/><rect y="61" width="64" height="9"/><rect y="78" width="74" height="9"/></g></svg></span><b>PM Prep</b><span class="muted" style="color:#ccc">· Instructor dashboard</span></div></header>
<main id="app">
  <div class="center"><div class="card white login">
    <h1>Instructor login</h1><p class="muted">Class-level results of the mock exams.</p>
    <label for="pw">Password</label><input type="password" id="pw" style="width:100%" autocomplete="current-password">
    <div style="margin-top:12px"><button class="btn" id="loginBtn" style="width:100%">Log in</button></div>
    <div class="err" id="err" role="alert"></div>
  </div></div>
</main>
<script>
var TOKEN=null, DATA=null, SORT={k:'p',dir:1};
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function pct(x){ return x==null||isNaN(x)?'–':Math.round(x*100)+'%'; }
var API_URL='https://script.google.com/macros/s/AKfycby9n5U5gExg5Jd-n0nVj6GCcUKsU2e_ZqJl_b6kyS9OGbo04Zf2FUwx0iij5y-TcA-n/exec';
function api(fn){
  var args = Array.prototype.slice.call(arguments,1);
  if(window.google && google.script && google.script.run){
    return new Promise(function(res,rej){
      var r = google.script.run.withSuccessHandler(res).withFailureHandler(function(e){ rej(e instanceof Error?e:new Error(String(e && e.message || e))); });
      r[fn].apply(r,args);
    });
  }
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args}),credentials:'omit',redirect:'follow'})
    .then(function(r){ if(!r.ok) throw new Error('Server error ('+r.status+')'); return r.json(); })
    .then(function(j){ if(!j.ok) throw new Error(j.error||'Request failed'); return j.result; },
          function(e){ throw (e && /Server error|Request failed/.test(e.message)) ? e : new Error('Connection problem. Check your internet and try again.'); });
}
function $(id){ return document.getElementById(id); }

$('loginBtn').onclick=login; $('pw').onkeydown=function(e){ if(e.key==='Enter') login(); };
function login(){
  $('err').textContent=''; $('loginBtn').disabled=true;
  api('adminLogin',$('pw').value).then(function(tok){ TOKEN=tok; shell(); load(); })
    .catch(function(e){ $('err').textContent=e.message; $('loginBtn').disabled=false; });
}
function shell(){
  var d0=new Date(), today=d0.getFullYear()+'-'+String(d0.getMonth()+1).padStart(2,'0')+'-'+String(d0.getDate()).padStart(2,'0');
  $('app').innerHTML='<div class="row" style="justify-content:space-between;align-items:center"><div><h1>Class results</h1><div class="muted" id="sub"></div></div></div>'+
   '<div class="card white" style="margin-top:14px"><div class="row">'+
   '<div><label for="fMode">Exam</label><select id="fMode"><option value="course">Course mock exam (60 Q)</option><option value="quick">Quick quiz (20 Q)</option><option value="full">Full-length PMP simulation (180 Q)</option></select></div>'+
   '<div><label for="fFrom">From</label><input type="date" id="fFrom"></div><div><label for="fTo">To</label><input type="date" id="fTo" value="'+today+'"></div>'+
   '<div><label for="fValid">Attempts</label><select id="fValid"><option value="1">Valid only (Table H.2)</option><option value="0">All attempts</option></select></div>'+
   '<div><button class="btn" id="apply">Apply</button></div><div><button class="btn dark" id="addBtn">＋ Add questions</button></div><div style="flex:1"></div>'+
   '<div><button class="btn ghost" id="expR">Download Responses CSV</button> <button class="btn ghost" id="expA">Download Answers CSV</button> <button class="btn ghost" id="expS">Download Students CSV</button></div></div></div>'+
   '<div id="addq" class="card white hide" style="margin-top:14px"></div>'+
   '<div id="dash"><div class="center"><div class="muted">Loading…</div></div></div>';
  $('addBtn').onclick=toggleAdd;
  $('apply').onclick=load; $('expR').onclick=function(){ exportCsv('responses'); }; $('expA').onclick=function(){ exportCsv('answers'); }; $('expS').onclick=function(){ exportCsv('students'); };
}
function load(){
  $('dash').innerHTML='<div class="center"><div class="muted">Loading…</div></div>';
  api('adminStats',TOKEN,{mode:$('fMode').value,from:$('fFrom').value,to:$('fTo').value,validOnly:$('fValid').value==='1'})
    .then(function(d){ DATA=d; draw(); })
    .catch(function(e){ $('dash').innerHTML='<p class="err">'+esc(e.message)+'</p>'; if(/log in/i.test(e.message)) setTimeout(function(){ location.reload(); },1500); });
}
function kpi(label,value,target,good){ var cls=good==null?'neu':(good?'okb':'badb'); return '<div class="card kpi '+cls+'"><div class="muted">'+esc(label)+'</div><div class="v">'+value+'</div><div class="tgt">'+esc(target)+(good===false?' <b style="color:var(--bad)">· below target</b>':'')+'</div></div>'; }
function draw(){
  var d=DATA, pm=d.passMark;
  $('sub').textContent=d.modeLabel+' · '+d.responses+' attempts counted'+(d.allResponses!==d.responses?' ('+d.allResponses+' in total)':'')+' · '+d.registered+' students registered';
  if(!d.responses){ $('dash').innerHTML='<div class="card" style="margin-top:14px"><b>No attempts yet for these filters.</b><p class="muted">Share the student link and come back once people have taken the exam. Data is saved in <a href="'+esc(d.sheetUrl)+'" target="_blank">the Google Sheet</a>.</p></div>'+flagsHtml(d); return; }
  var h='<div class="grid k4" style="margin-top:14px">'+
    kpi('Average score',pct(d.avgScore),'Target ≥ 70%',d.avgScore>=pm)+
    kpi('Readiness rate',pct(d.readiness),'% of attempts scoring ≥ 70% · target ≥ 60%',d.readiness>=0.6)+
    kpi('Median completion time',d.medianMinutes==null?'–':Math.round(d.medianMinutes)+' min','Target ≤ 80 min (course exam)',d.mode==='course'?d.medianMinutes<=80:null)+
    kpi('Attempts',String(d.responses),'Valid attempts in the selected period',null)+'</div>';
  h+='<div class="grid g2" style="margin-top:14px"><div class="card"><h3>Accuracy by PMP domain <span class="muted" style="font-weight:400">(PMI exam outline, July 2026 · line = 65%)</span></h3>'+
    d.byDomain.map(function(x){ var low=x.accuracy!=null&&x.accuracy<d.domainFlag; return '<div class="metric"><div>'+x.domain+' · '+esc(x.name)+(d.weights?' <span class="muted">(exam weight '+pct(d.weights[x.domain])+')</span>':'')+(low?'<span class="flag">⚑ below 65%</span>':'')+'</div><b>'+pct(x.accuracy)+'</b><div class="bar '+(x.accuracy==null?'':(low?'bad':'ok'))+'" style="grid-column:1/-1"><i style="width:'+(x.accuracy==null?0:Math.round(x.accuracy*100))+'%"></i><span class="line" style="left:'+Math.round(d.domainFlag*100)+'%"></span></div></div>'; }).join('')+'</div>';
  var max=Math.max.apply(null,d.histogram.concat([1]));
  h+='<div class="card"><h3>Score distribution <span class="muted" style="font-weight:400">(green = 70% and above)</span></h3><div class="hist">'+d.histogram.map(function(n,i){ return '<div class="'+(i>=7?'pass':'')+'" style="height:'+Math.round(n/max*100)+'%" title="'+n+' attempts"><span>'+(n||'')+'</span></div>'; }).join('')+'</div><div class="hlab">'+d.histogram.map(function(n,i){ return '<div>'+(i*10)+'–'+(i*10+9)+'</div>'; }).join('')+'</div></div></div>';
  if(d.byApproach){
    h+='<div class="card" style="margin-top:14px"><h3>Accuracy by delivery approach <span class="muted" style="font-weight:400">(Any = approach-neutral · line = 70%)</span></h3><div class="grid g2" style="gap:4px 24px">'+
      d.byApproach.map(function(x){ return '<div class="metric"><div>'+esc(x.approach)+' <span class="muted">('+x.attempts+' answers)</span></div><b>'+pct(x.accuracy)+'</b><div class="bar '+(x.accuracy==null?'':(x.accuracy>=pm?'ok':'bad'))+'" style="grid-column:1/-1"><i style="width:'+(x.accuracy==null?0:Math.round(x.accuracy*100))+'%"></i><span class="line" style="left:'+Math.round(pm*100)+'%"></span></div></div>'; }).join('')+'</div></div>';
  }
  if(d.byLevel){
    h+='<div class="grid g2" style="margin-top:14px"><div class="card"><h3>Accuracy by level <span class="muted" style="font-weight:400">(Easy / Medium / Hard · line = 70%)</span></h3>'+
      d.byLevel.map(function(x){ return '<div class="metric"><div>'+esc(x.level)+' <span class="muted">('+x.attempts+' answers)</span></div><b>'+pct(x.accuracy)+'</b><div class="bar '+(x.accuracy==null?'':(x.accuracy>=pm?'ok':'bad'))+'" style="grid-column:1/-1"><i style="width:'+(x.accuracy==null?0:Math.round(x.accuracy*100))+'%"></i><span class="line" style="left:'+Math.round(pm*100)+'%"></span></div></div>'; }).join('')+'</div>';
    h+='<div class="card"><h3>Domain × level <span class="muted" style="font-weight:400">(accuracy · red = below 65%)</span></h3><div style="overflow-x:auto"><table class="mx"><thead><tr><th>Domain</th>'+d.levels.map(function(l){return '<th>'+esc(l)+'</th>';}).join('')+'</tr></thead><tbody>'+
      d.domainLevel.map(function(r){ return '<tr><td><b>'+r.domain+'</b> · '+esc(r.name)+'</td>'+r.cells.map(function(c){ var low=c.accuracy!=null&&c.accuracy<d.domainFlag; return '<td class="'+(c.accuracy==null?'':(low?'lo':'hi'))+'"><b>'+pct(c.accuracy)+'</b>'+(low?' ⚑':'')+'<div class="muted" style="font-size:11px">'+c.attempts+' answers</div></td>'; }).join('')+'</tr>'; }).join('')+
      '</tbody></table></div><p class="note" style="margin:8px 0 0">Shows whether a weak domain is weak at every level or only on hard questions.</p></div></div>';
  }
  h+='<div class="card" style="margin-top:14px"><h3>Accuracy by PMP task, lowest first <span class="muted" style="font-weight:400">(the 3 lowest are flagged for review)</span></h3>'+
    d.byLecture.map(function(x){ return '<div class="metric"><div>'+esc(x.name)+(x.flag?'<span class="flag">⚑ review</span>':'')+' <span class="muted">('+x.attempts+' answers)</span></div><b>'+pct(x.accuracy)+'</b><div class="bar '+(x.flag?'bad':(x.accuracy>=pm?'ok':''))+'" style="grid-column:1/-1"><i style="width:'+Math.round(x.accuracy*100)+'%"></i><span class="line" style="left:'+Math.round(pm*100)+'%"></span></div></div>'; }).join('')+'</div>';
  h+='<h2>Students</h2><p class="note">One row per university ID for the selected exam and period. Ready = best score at or above 70%. A student who forgot the PIN: clear the PinHash cell of that ID in the Students sheet, then the student signs in again and chooses a new PIN.</p><div class="tablewrap"><table><thead><tr><th>University ID</th><th>Nickname</th><th>Attempts</th><th>Best</th><th>Last</th><th>Average</th><th>Last attempt</th><th>Ready</th></tr></thead><tbody>'+
    d.students.map(function(x){ return '<tr><td><b>'+esc(x.studentId)+'</b></td><td>'+esc(x.nickname)+'</td><td>'+x.attempts+'</td><td><b>'+pct(x.best)+'</b></td><td>'+pct(x.last)+'</td><td>'+pct(x.avg)+'</td><td>'+esc(String(x.lastDate).replace('T',' ').slice(0,16))+'</td><td>'+(x.ready?'<span style="color:var(--ok);font-weight:700">✓</span>':'<span style="color:var(--bad)">✗</span>')+'</td></tr>'; }).join('')+'</tbody></table></div>';
  h+='<h2>Question analysis</h2><p class="note">p-value = share of candidates who answered correctly (flagged below 0.30 or above 0.90). Top distractor = most-chosen wrong option (flagged above 40%). Click a column to sort.</p><div class="tablewrap"><table id="qt"><thead><tr>'+
    [['id','ID'],['text','Question'],['domain','Dom.'],['pmpTask','Task'],['approach','Approach'],['difficulty','Level'],['attempts','Answers'],['p','p-value'],['key','Key'],['topDistractor','Top wrong'],['distractorShare','Share']].map(function(c){ return '<th data-k="'+c[0]+'">'+c[1]+(SORT.k===c[0]?(SORT.dir>0?' ▲':' ▼'):'')+'</th>'; }).join('')+'</tr></thead><tbody>'+
    sorted(d.questions).map(function(q){ var f=q.flagP||q.flagDistractor; return '<tr class="'+(f?'fl':'')+'"><td><b>'+esc(q.id)+'</b></td><td>'+esc(q.text.length>110?q.text.slice(0,107)+'…':q.text)+'</td><td>'+q.domain+'</td><td>'+esc(q.pmpTask||'')+'</td><td>'+esc(q.approach||'')+'</td><td>'+esc(q.difficulty||'')+'</td><td>'+q.attempts+'</td><td><b>'+(q.p==null?'–':q.p.toFixed(2))+'</b>'+(q.flagP?' ⚑':'')+'</td><td>'+q.key+'</td><td>'+esc(q.topDistractor)+'</td><td>'+(q.topDistractor?pct(q.distractorShare):'–')+(q.flagDistractor?' ⚑':'')+'</td></tr>'; }).join('')+'</tbody></table></div>';
  h+=flagsHtml(d);
  h+='<p class="note" style="margin-top:20px">All data lives in <a href="'+esc(d.sheetUrl)+'" target="_blank">the Google Sheet</a> (sheets Responses and Answers, same columns as the Power BI model). Blank answers count as wrong in the score and are left out of accuracy, as in report Table H.2.</p>';
  $('dash').innerHTML=h;
  document.querySelectorAll('#qt th').forEach(function(th){ th.onclick=function(){ var k=th.getAttribute('data-k'); SORT.dir=SORT.k===k?-SORT.dir:1; SORT.k=k; draw(); }; });
}
function sorted(list){ var k=SORT.k,dir=SORT.dir; return list.slice().sort(function(a,b){ var x=a[k],y=b[k]; if(x==null) return 1; if(y==null) return -1; return (x>y?1:x<y?-1:0)*dir; }); }
function flagsHtml(d){
  if(!d.flags.length) return '<h2>Reported questions</h2><p class="muted">No open reports.</p>';
  return '<h2>Reported questions</h2><div class="tablewrap"><table><thead><tr><th>ID</th><th>Reports</th><th>Reasons</th><th>Notes</th></tr></thead><tbody>'+d.flags.map(function(f){ return '<tr><td><b>'+esc(f.id)+'</b></td><td>'+f.count+'</td><td>'+Object.keys(f.reasons).map(function(r){return esc(r)+' ('+f.reasons[r]+')';}).join(', ')+'</td><td>'+f.notes.slice(0,3).map(esc).join('<br>')+'</td></tr>'; }).join('')+'</tbody></table></div><p class="note">To close a report, set its Status to Closed in the Flags sheet. To fix a question, edit it in the Questions sheet (or set Active = FALSE).</p>';
}
/* ------------------------------------------------------------ add questions from an Excel template */
var TPL_COLS=['QuestionID','Status','PMP_Task','Approach','Item_Type','Difficulty','Question','Option_A','Option_B','Option_C','Option_D','Correct_Option','Explanation','Source'];
var PMP_TASKS=[['I.1','People','Develop a common vision'],['I.2','People','Manage conflicts'],['I.3','People','Lead the project team'],['I.4','People','Engage stakeholders'],['I.5','People','Align stakeholder expectations'],['I.6','People','Manage stakeholder expectations'],['I.7','People','Help ensure knowledge transfer'],['I.8','People','Plan and manage communication'],
 ['II.1','Process','Develop an integrated project management plan and plan delivery'],['II.2','Process','Develop and manage project scope'],['II.3','Process','Help ensure value-based delivery'],['II.4','Process','Plan and manage resources'],['II.5','Process','Plan and manage procurement'],['II.6','Process','Plan and manage finance'],['II.7','Process','Plan and optimize quality of products/deliverables'],['II.8','Process','Plan and manage schedule'],['II.9','Process','Evaluate project status'],['II.10','Process','Manage project closure'],
 ['III.1','Business Environment','Define and establish project governance'],['III.2','Business Environment','Plan and manage project compliance'],['III.3','Business Environment','Manage and control changes'],['III.4','Business Environment','Remove impediments and manage issues'],['III.5','Business Environment','Plan and manage risk'],['III.6','Business Environment','Continuous improvement'],['III.7','Business Environment','Support organizational change'],['III.8','Business Environment','Evaluate external business environment changes']];
var PENDING=null;
function toggleAdd(){
  var box=$('addq'); if(!box.classList.contains('hide')){ box.classList.add('hide'); return; }
  box.classList.remove('hide');
  box.innerHTML='<h2 style="margin-top:0">Add questions to the bank</h2>'+
    '<ol class="steps"><li><b>Download the Excel template.</b> <button class="btn ghost" id="tplBtn">Download template</button></li>'+
    '<li><b>Fill one row per question</b> in the sheet <i>Questions</i>. The sheet <i>Allowed values</i> lists the 26 PMP task codes (I.1–III.8) and the other choices; the sheet <i>Example</i> shows a filled row. Leave QuestionID empty to number new questions automatically (A001, A002 …).</li>'+
    '<li><b>Upload the filled file.</b> <input type="file" id="upFile" accept=".xlsx,.xls,.csv"> The file is checked first; nothing is added until you confirm.</li></ol>'+
    '<p class="note">New questions go to <b>Bank</b> (practice, quick quiz and full-length exam) or <b>Reserve</b>. The 60-question course exam set stays fixed so its 20 / 25 / 15 blueprint does not change.</p>'+
    '<div id="upOut"></div>';
  $('tplBtn').onclick=downloadTemplate;
  $('upFile').onchange=function(){ if(this.files[0]) readUpload(this.files[0]); };
}
function needXlsx(){ if(!window.XLSX){ $('upOut').innerHTML='<p class="bad-msg">The Excel reader did not load. Check your internet connection and reload the page.</p>'; return false; } return true; }
function downloadTemplate(){
  if(!needXlsx()) return;
  var wb=XLSX.utils.book_new();
  var q=XLSX.utils.aoa_to_sheet([TPL_COLS]); q['!cols']=[10,9,9,11,11,10,60,30,30,30,30,13,50,20].map(function(w){return {wch:w};});
  XLSX.utils.book_append_sheet(wb,q,'Questions');
  var ex=XLSX.utils.aoa_to_sheet([TPL_COLS,['','Bank','III.5','Hybrid','Scenario','Medium','During a sprint review, the team reports that a key supplier may deliver late. What should the project manager do first?','Wait for the supplier to confirm the delay','Assess the risk and update the risk register with a response','Ask the sponsor for more budget','Remove the feature from the backlog','B','A possible late delivery is a risk: assess it and plan a response before it becomes an issue.','Instructor']]);
  ex['!cols']=q['!cols']; XLSX.utils.book_append_sheet(wb,ex,'Example');
  var av=[['PMP_Task (code)','PMP domain','Task'],].concat(PMP_TASKS);
  av.push([],['Approach','Predictive / Agile / Hybrid / Any'],['Item_Type','Scenario / Calculation / Knowledge'],['Difficulty','Easy / Medium / Hard'],['Status','Bank / Reserve (empty = Bank)'],['Correct_Option','A / B / C / D']);
  var a=XLSX.utils.aoa_to_sheet(av); a['!cols']=[{wch:16},{wch:22},{wch:62}]; XLSX.utils.book_append_sheet(wb,a,'Allowed values');
  var how=XLSX.utils.aoa_to_sheet([['How to fill the Questions sheet'],[''],['1. One row per question. Do not change the column names in row 1.'],['2. QuestionID: leave empty to number automatically, or use your own new ID (letters and digits).'],['3. PMP_Task: the task code only, e.g. II.6. The PMP domain is set from it.'],['4. Question, Option_A–Option_D and Correct_Option are required; the four options must be different.'],['5. Explanation: why the correct answer is right (shown to students after they answer).'],['6. Save the file and upload it on the instructor page: Add questions → Upload.'],['7. Before a new question is used in a graded exam, two members should check its answer key.']]);
  how['!cols']=[{wch:100}]; XLSX.utils.book_append_sheet(wb,how,'How to fill');
  XLSX.writeFile(wb,'PM_Prep_question_template.xlsx');
}
function normKey(k){ return String(k).toLowerCase().replace(/[^a-z0-9]/g,''); }
function readUpload(file){
  if(!needXlsx()) return;
  $('upOut').innerHTML='<p class="muted">Reading the file…</p>';
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var wb=XLSX.read(new Uint8Array(fr.result),{type:'array'});
      var name=wb.SheetNames.indexOf('Questions')>=0?'Questions':wb.SheetNames[0];
      var raw=XLSX.utils.sheet_to_json(wb.Sheets[name],{defval:'',raw:false});
      var map={}; TPL_COLS.forEach(function(c){ map[normKey(c)]=c; });
      var rows=[];
      raw.forEach(function(r,i){
        var o={_row:i+2};
        Object.keys(r).forEach(function(k){ var c=map[normKey(k)]; if(c) o[c]=String(r[k]).trim(); });
        if(!(o.Question||o.Option_A||o.Option_B)) return;           // skip empty rows
        rows.push(o);
      });
      if(!rows.length){ $('upOut').innerHTML='<p class="bad-msg">No question rows found in the sheet "'+esc(name)+'".</p>'; return; }
      if(rows.length>300){ $('upOut').innerHTML='<p class="bad-msg">'+rows.length+' rows found; upload at most 300 at a time.</p>'; return; }
      $('upOut').innerHTML='<p class="muted">Checking '+rows.length+' rows…</p>';
      api('adminAddQuestions',TOKEN,rows,true).then(function(r){ PENDING=rows; showCheck(r); })
        .catch(function(e){ $('upOut').innerHTML='<p class="bad-msg">'+esc(e.message)+'</p>'; });
    }catch(e){ $('upOut').innerHTML='<p class="bad-msg">This file could not be read. Save it as .xlsx from the template and try again.</p>'; }
  };
  fr.readAsArrayBuffer(file);
}
function showCheck(r){
  var h='<h3 style="margin-top:12px">Check result</h3><p><b>'+r.ready+'</b> question'+(r.ready===1?'':'s')+' ready to add'+(r.errors.length?' · <b style="color:var(--bad)">'+r.errors.length+' row'+(r.errors.length===1?'':'s')+' with problems</b> (they will be skipped)':'')+'.</p>';
  if(r.errors.length) h+='<div class="tablewrap" style="max-height:220px"><table><thead><tr><th>Row</th><th>Problem</th></tr></thead><tbody>'+r.errors.map(function(e){ return '<tr class="fl"><td>'+e.row+'</td><td>'+e.reasons.map(esc).join('<br>')+'</td></tr>'; }).join('')+'</tbody></table></div>';
  if(r.preview.length) h+='<div class="tablewrap" style="margin-top:10px;max-height:260px"><table><thead><tr><th>New ID</th><th>Task</th><th>Level</th><th>Key</th><th>Question</th></tr></thead><tbody>'+r.preview.map(function(p){ return '<tr><td><b>'+esc(p.id)+'</b></td><td>'+esc(p.task)+'</td><td>'+esc(p.level)+'</td><td>'+esc(p.key)+'</td><td>'+esc(p.text)+'</td></tr>'; }).join('')+'</tbody></table></div>'+(r.ready>r.preview.length?'<p class="note">Showing the first '+r.preview.length+' of '+r.ready+'.</p>':'');
  if(r.ready) h+='<div class="row" style="margin-top:12px"><button class="btn" id="confirmAdd">Add '+r.ready+' question'+(r.ready===1?'':'s')+' to the bank</button><button class="btn ghost" id="cancelAdd">Cancel</button></div>';
  $('upOut').innerHTML=h;
  if(r.ready){
    $('cancelAdd').onclick=function(){ PENDING=null; $('upFile').value=''; $('upOut').innerHTML=''; };
    $('confirmAdd').onclick=function(){
      this.disabled=true; this.textContent='Adding…';
      api('adminAddQuestions',TOKEN,PENDING,false).then(function(x){
        PENDING=null; $('upFile').value='';
        $('upOut').innerHTML='<p class="ok-msg">Added '+x.added+' question'+(x.added===1?'':'s')+(x.ids.length?' ('+esc(x.ids[0])+(x.ids.length>1?' – '+esc(x.ids[x.ids.length-1]):'')+')':'')+'. The bank now has '+x.bankSize+' questions; students see them in practice right away.</p>'+(x.errors.length?'<p class="note">'+x.errors.length+' row(s) were skipped.</p>':'');
      }).catch(function(e){ $('upOut').innerHTML='<p class="bad-msg">'+esc(e.message)+'</p>'; });
    };
  }
}
function exportCsv(which){
  api('adminExport',TOKEN,which).then(function(rows){
    var csv=rows.map(function(r){ return r.map(function(v){ v=String(v==null?'':v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(','); }).join('\r\n');
    var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'})); a.download=(which==='answers'?'Answers':which==='students'?'Students':'Responses')+'.csv'; document.body.appendChild(a); a.click(); a.remove();
  }).catch(function(e){ alert(e.message); });
}
</script>
