<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PM Prep</title>
<style>
  :root{
    --brand:#FA9310;          /* PM Prep logo orange */
    --brand-dark:#C96F0A;
    --brand-soft:#FFF3E3;
    --ink:#1F1F1F;
    --muted:#5E5E5E;
    --line:#E3E3E3;
    --card:#F6F6F6;
    --bg:#FFFFFF;
    --ok:#2E7D32; --ok-soft:#E8F5E9;
    --bad:#C62828; --bad-soft:#FDECEA;
    --mark:#6A4FB3;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans Arabic",sans-serif;font-size:16px;line-height:1.5}
  body[dir=rtl]{font-family:"Segoe UI","Noto Sans Arabic",Tahoma,Arial,sans-serif}
  button{font:inherit;cursor:pointer}
  a{color:var(--brand-dark)}
  .topbar{background:var(--ink);color:#fff;position:sticky;top:0;z-index:20}
  .topbar .in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 16px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;letter-spacing:.2px;cursor:pointer;white-space:nowrap;flex:0 0 auto}
  .brand img{height:30px}
  .mark{width:32px;height:30px;display:grid;place-items:center}
  .nav{display:flex;gap:4px;margin-inline-start:auto;flex-wrap:nowrap;align-items:center}
  .nav button{background:transparent;border:0;color:#ddd;padding:8px 10px;border-radius:8px}
  .nav button[aria-current=page]{color:#fff;background:rgba(255,255,255,.12)}
  .nav button:hover{color:#fff}
  .lang{border:1px solid rgba(255,255,255,.35)!important;color:#fff!important}
  main{max-width:980px;margin:0 auto;padding:22px 16px 60px}
  h1{font-size:26px;margin:4px 0 6px} h2{font-size:20px;margin:22px 0 10px} h3{font-size:17px;margin:0 0 6px}
  .muted{color:var(--muted)}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
  .g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
  .card{background:var(--card);border-radius:var(--radius);padding:18px}
  .card.white{background:#fff;border:1px solid var(--line)}
  .hero{background:linear-gradient(135deg,var(--ink) 0%,#3a3a3a 100%);color:#fff;border-radius:var(--radius);padding:24px;position:relative;overflow:hidden}
  .hero:after{content:"";position:absolute;inset-inline-end:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:var(--brand);opacity:.9}
  .hero > *{position:relative;z-index:1}
  .hero p{color:#e8e8e8;max-width:560px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:11px 18px;font-weight:600;background:var(--brand);color:#1b1b1b;min-height:44px}
  .btn:hover{background:#ffa53a}
  .btn.dark{background:var(--ink);color:#fff}
  .btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
  .btn.ghost:hover{border-color:var(--ink)}
  .btn.small{padding:7px 12px;min-height:36px;font-size:14px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .stat{font-size:30px;font-weight:700}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;background:#fff;border:1px solid var(--line);color:var(--muted)}
  .pill.brand{background:var(--brand-soft);border-color:#f7c78a;color:#7a4300}
  label.f{display:block;font-weight:600;font-size:14px;margin:0 0 6px}
  .lg label.f{font-size:16px;font-weight:700;margin-top:14px}
  .lg input[type=text],.lg input[type=password]{font-size:20px;padding:13px 14px;min-height:54px;border:2px solid #9E9E9E;border-radius:12px}
  .lg input:focus{border-color:var(--brand)}
  .lg input.pinbox{letter-spacing:6px;font-weight:700}
  .pinrow{display:flex;gap:8px;align-items:stretch} .pinrow input{flex:1;min-width:0}
  .pinrow button{border:2px solid #9E9E9E;background:#fff;border-radius:12px;padding:0 14px;font-weight:600;min-width:72px}
  .pinhint{font-size:13px;color:var(--muted);margin-top:6px}
  select,input[type=text],input[type=password],textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:#fff}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .spacer{flex:1}
  .qtext{font-size:18px;font-weight:600;margin:6px 0 14px;direction:ltr;text-align:left;unicode-bidi:plaintext}
  .opts{display:grid;gap:10px;direction:ltr}
  .opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink)}
  .opt:hover{border-color:#bdbdbd}
  .opt .k{flex:0 0 30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--card);font-weight:700}
  .opt[aria-pressed=true]{border-color:var(--brand);background:var(--brand-soft)}
  .opt[aria-pressed=true] .k{background:var(--brand)}
  .opt.ok{border-color:var(--ok);background:var(--ok-soft)} .opt.ok .k{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:var(--bad-soft)} .opt.bad .k{background:var(--bad);color:#fff}
  .feedback{border-radius:12px;padding:12px 14px;margin-top:14px;direction:ltr;text-align:left}
  .feedback.ok{background:var(--ok-soft);border:1px solid #b9dfbc} .feedback.bad{background:var(--bad-soft);border:1px solid #f3c0bb}
  .bar{height:10px;background:#e7e7e7;border-radius:6px;overflow:hidden;position:relative}
  .bar > i{display:block;height:100%;background:var(--brand)}
  .bar.ok > i{background:var(--ok)} .bar.bad > i{background:var(--bad)}
  .bar .line{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
  .metric{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;margin:10px 0}
  .examhead{position:sticky;top:var(--hh,62px);z-index:10;background:#fff;border-bottom:1px solid var(--line);margin:-22px -16px 16px;padding:10px 16px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;padding:4px 12px;border-radius:8px;background:var(--card)}
  .timer.low{background:var(--bad-soft);color:var(--bad)}
  .navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
  .navgrid button{height:38px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:600}
  .navgrid button.ans{background:var(--ink);color:#fff;border-color:var(--ink)}
  .navgrid button.mk{border-color:var(--mark);box-shadow:inset 0 -4px 0 var(--mark)}
  .navgrid button.cur{outline:3px solid var(--brand);outline-offset:1px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px;z-index:50}
  .modal .box{background:#fff;border-radius:16px;max-width:460px;width:100%;padding:22px}
  .tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px}
  .tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.skip{background:#eee;color:#555}
  .review-item{border-top:1px solid var(--line);padding:14px 0}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:60;max-width:90vw}
  .center{display:grid;place-items:center;min-height:40vh;text-align:center}
  .spin{width:34px;height:34px;border:4px solid #eee;border-top-color:var(--brand);border-radius:50%;animation:s 1s linear infinite;margin:0 auto 12px}
  @keyframes s{to{transform:rotate(360deg)}}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:start}
  footer{max-width:980px;margin:0 auto;padding:18px 16px 30px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
  .hide{display:none!important}
  @media (max-width:640px){
    .nav .lbl{display:none}
    .nav button{padding:8px 7px}
    .hero:after{width:96px;height:96px;inset-inline-end:-48px;top:-48px}
    .hero h1{padding-inline-end:36px}
    .brand{font-size:17px}
    .topbar .in{gap:8px;padding:8px 10px}
    h1{font-size:22px}
  }
  :focus-visible{outline:3px solid var(--brand);outline-offset:2px}
</style>
</head>

function newId(){ var a='abcdefghijklmnopqrstuvwxyz0123456789',s=''; var r=(window.crypto&&crypto.getRandomValues)?crypto.getRandomValues(new Uint8Array(24)):null; for(var i=0;i<24;i++) s+=a[(r?r[i]:Math.floor(Math.random()*256))%36]; return 's-'+s; }

/* ------------------------------------------------------------ server calls */
var API_URL='https://script.google.com/macros/s/AKfycby9n5U5gExg5Jd-n0nVj6GCcUKsU2e_ZqJl_b6kyS9OGbo04Zf2FUwx0iij5y-TcA-n/exec';
function api(fn){
  var args = Array.prototype.slice.call(arguments,1);
  if(window.google && google.script && google.script.run){
    return new Promise(function(res,rej){
      var r = google.script.run.withSuccessHandler(res).withFailureHandler(function(e){ rej(e instanceof Error?e:new Error(String(e && e.message || e))); });
      r[fn].apply(r,args);
    });
  }
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args}),credentials:'omit',redirect:'follow'})
    .then(function(r){ if(!r.ok) throw new Error('Server error ('+r.status+')'); return r.json(); })
    .then(function(j){ if(!j.ok) throw new Error(j.error||'Request failed'); return j.result; },
          function(e){ throw (e && /Server error|Request failed/.test(e.message)) ? e : new Error('Connection problem. Check your internet and try again.'); });
}
var api0=api;
api=function(){ return api0.apply(null,arguments).catch(function(e){ if(e && /sign in again/i.test(e.message)){ signOut(true); } throw e; }); };
function toast(msg){ var d=document.createElement('div'); d.className='toast'; d.setAttribute('role','status'); d.textContent=msg; document.body.appendChild(d); setTimeout(function(){d.remove();},3200); }
function loading(msg){ app().innerHTML='<div class="center"><div><div class="spin"></div><div class="muted">'+esc(msg||'…')+'</div></div></div>'; }

    S.practice={qs:qs,i:0,sel:null,fb:null,right:0,filters:filters}; go('practice-run');
  }).catch(function(e){ toast(e.message||t('loadErr')); go('practice'); });

  m.querySelector('#fS').onclick=function(){ var b=this; b.disabled=true; api('flagQuestion',S.sid,qid,m.querySelector('#fR').value,m.querySelector('#fN').value).then(function(){ m.remove(); toast(t('thanks')); }).catch(function(e){ b.disabled=false; toast(e.message); }); };
}

/* ------------------------------------------------------------ exams */
function viewExamList(){
  var saved=store('exam');
  var h='<h1>'+esc(t('examTitle'))+'</h1><p class="muted">'+esc(t('examText'))+'</p>';
  if(saved) h+='<div class="card white" style="border-color:var(--brand);margin-bottom:14px"><div class="row"><b>'+esc(t('resume'))+'</b><span class="muted">'+esc(modeLabel(saved.mode))+'</span><span class="spacer"></span><button class="btn small" id="resumeBtn">'+esc(t('resumeBtn'))+'</button><button class="btn ghost small" id="discardBtn">'+esc(t('discard'))+'</button></div></div>';
  h+='<div class="grid g3">'+['course','quick','full'].filter(function(k){return S.cfg.modes[k];}).map(function(k){
    var m=S.cfg.modes[k], b=m.blueprint;
    return '<div class="card white"><h3>'+esc(modeLabel(k))+'</h3><div class="muted" style="margin-bottom:10px">'+m.total+' '+esc(t('questions'))+' · '+m.minutes+' '+esc(t('minutes'))+'</div><div class="muted" style="font-size:13px;margin-bottom:12px">'+[1,2,3].map(function(d){return esc(domName(d))+': '+b[d];}).join('<br>')+(m.approachMix?'<br><span style="display:inline-block;margin-top:6px">'+esc(t('apMix'))+': '+(S.cfg.approaches||[]).map(function(p){return esc(apName(p.approach))+' '+(m.approachMix[p.approach]||0);}).join(' · ')+'</span>':'')+'<br><span style="display:inline-block;margin-top:6px">'+(m.levelMix?esc(t('levelMix'))+': '+(S.cfg.levels||['Easy','Medium','Hard']).map(function(l){return esc(lvlName(l))+' '+(m.levelMix[l]||0);}).join(' · '):esc(t('levelRandom')))+'</span></div><button class="btn'+(k==='course'?'':' ghost')+'" data-mode="'+k+'"'+(saved?' disabled':'')+'>'+esc(t('start'))+'</button></div>';
  }).join('')+'</div>';
  app().innerHTML=h;
  var rb=document.getElementById('resumeBtn'); if(rb) rb.onclick=function(){ S.exam=saved; go('exam-run'); };
  var db=document.getElementById('discardBtn'); if(db) db.onclick=function(){ store('exam',null); S.exam=null; viewExamList(); };
  app().querySelectorAll('[data-mode]').forEach(function(b){ b.onclick=function(){ consent(b.getAttribute('data-mode')); }; });
}
function consent(mode){
  var m=document.createElement('div'); m.className='modal';
  m.innerHTML='<div class="box" role="dialog" aria-modal="true" aria-labelledby="cT"><h3 id="cT">'+esc(t('consentTitle'))+'</h3><p>'+esc(t('consent'))+'</p><p class="muted">'+S.cfg.modes[mode].total+' '+esc(t('questions'))+' · '+S.cfg.modes[mode].minutes+' '+esc(t('minutes'))+'</p><div class="row" style="justify-content:flex-end"><button class="btn ghost small" id="cC">'+esc(t('cancel'))+'</button><button class="btn" id="cOk">'+esc(t('agree'))+'</button></div></div>';
  document.body.appendChild(m); m.querySelector('#cOk').focus();
  m.querySelector('#cC').onclick=function(){ m.remove(); };
  m.querySelector('#cOk').onclick=function(){
    m.remove(); loading();
    api('startExam',S.sid,S.nick,mode).then(function(x){
      x.answers={}; x.marked={}; x.idx=0; x.deadline=Date.now()+x.minutes*60000;
      S.exam=x; store('exam',x); go('exam-run');
    }).catch(function(e){ toast(e.message||t('loadErr')); go('exam'); });
  };
}
var TICK=null;
function viewExamRun(){
  var E=S.exam; if(!E){ go('exam'); return; }
  var q=E.questions[E.idx], n=E.questions.length, done=Object.keys(E.answers).length;
  var h='<div class="examhead"><div class="row"><b>'+esc(modeLabel(E.mode))+'</b><span class="muted">'+done+'/'+n+'</span><span class="spacer"></span><span class="timer" id="timer" aria-live="off">--:--</span><button class="btn small dark" id="subBtn">'+esc(t('submit'))+'</button></div></div>';
  h+='<div class="grid" style="grid-template-columns:minmax(0,1fr)"><div class="card white"><div class="row"><b>'+esc(t('question'))+' '+(E.idx+1)+' '+esc(t('of'))+' '+n+'</b><span class="spacer"></span><button class="btn ghost small" id="markBtn" aria-pressed="'+(!!E.marked[q.id])+'" style="'+(E.marked[q.id]?'border-color:var(--mark);color:var(--mark)':'')+'">⚑ '+esc(E.marked[q.id]?t('marked'):t('markReview'))+'</button></div><div class="qtext">'+esc(q.text)+'</div>'+optsHtml(q,E.answers[q.id]||null,null)+
     '<div class="row" style="margin-top:16px"><button class="btn ghost" id="prevBtn"'+(E.idx===0?' disabled':'')+'>‹ '+esc(t('prev'))+'</button><span class="spacer"></span><button class="btn" id="nextBtn"'+(E.idx===n-1?' disabled':'')+'>'+esc(t('next'))+' ›</button></div></div>'+
     '<div class="card"><b>'+esc(t('navigator'))+'</b><div class="navgrid" style="margin-top:10px">'+E.questions.map(function(qq,i){ var c=(E.answers[qq.id]?'ans ':'')+(E.marked[qq.id]?'mk ':'')+(i===E.idx?'cur':''); return '<button class="'+c+'" data-i="'+i+'" aria-label="'+esc(t('question'))+' '+(i+1)+'">'+(i+1)+'</button>'; }).join('')+'</div><div class="legend"><span><i style="background:var(--ink)"></i>'+esc(t('legAns'))+'</span><span><i style="background:#fff;border:2px solid var(--mark)"></i>'+esc(t('legMark'))+'</span><span><i style="background:#fff;outline:2px solid var(--brand)"></i>'+esc(t('legCur'))+'</span></div></div></div>';
  app().innerHTML=h;
  app().querySelectorAll('.opt').forEach(function(b){ b.onclick=function(){ E.answers[q.id]=b.getAttribute('data-k'); store('exam',E); viewExamRun(); }; });
  app().querySelectorAll('.navgrid button').forEach(function(b){ b.onclick=function(){ E.idx=Number(b.getAttribute('data-i')); store('exam',E); viewExamRun(); window.scrollTo(0,0); }; });
  document.getElementById('prevBtn').onclick=function(){ if(E.idx>0){E.idx--; store('exam',E); viewExamRun(); window.scrollTo(0,0);} };
  document.getElementById('nextBtn').onclick=function(){ if(E.idx<n-1){E.idx++; store('exam',E); viewExamRun(); window.scrollTo(0,0);} };
  document.getElementById('markBtn').onclick=function(){ if(E.marked[q.id]) delete E.marked[q.id]; else E.marked[q.id]=true; store('exam',E); viewExamRun(); };
  document.getElementById('subBtn').onclick=confirmSubmit;
  startTick();
}
document.addEventListener('keydown',function(e){
  if(S.view!=='exam-run'||!S.exam||document.querySelector('.modal')) return;
  if(e.target && /input|textarea|select/i.test(e.target.tagName)) return;
  var k=e.key.toUpperCase(), E=S.exam, q=E.questions[E.idx];
  var map={'1':'A','2':'B','3':'C','4':'D',A:'A',B:'B',C:'C',D:'D'};
  if(map[k]){ E.answers[q.id]=map[k]; store('exam',E); viewExamRun(); }
  else if(e.key==='ArrowRight'&&E.idx<E.questions.length-1){ E.idx++; store('exam',E); viewExamRun(); }
  else if(e.key==='ArrowLeft'&&E.idx>0){ E.idx--; store('exam',E); viewExamRun(); }
});
function startTick(){
  clearInterval(TICK);
  function tick(){
    var el=document.getElementById('timer'); if(!S.exam||S.view!=='exam-run'){ clearInterval(TICK); return; }
    var left=Math.max(0,S.exam.deadline-Date.now()), m=Math.floor(left/60000), s=Math.floor(left%60000/1000);
    if(el){ el.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s; el.classList.toggle('low',left<5*60000); el.setAttribute('aria-label',m+' '+t('minLeft')); }
    if(left<=0){ clearInterval(TICK); doSubmit(true); }
  }
  tick(); TICK=setInterval(tick,1000);
}
function confirmSubmit(){
  var E=S.exam, left=E.questions.length-Object.keys(E.answers).length;
  var m=document.createElement('div'); m.className='modal';
  m.innerHTML='<div class="box" role="dialog" aria-modal="true" aria-labelledby="sT"><h3 id="sT">'+esc(t('confirmSubmit'))+'</h3>'+(left?'<p><b>'+left+'</b> '+esc(t('unanswered'))+'</p>':'')+'<div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn ghost small" id="sC">'+esc(t('keepGoing'))+'</button><button class="btn dark" id="sOk">'+esc(t('submitNow'))+'</button></div></div>';
  document.body.appendChild(m); m.querySelector('#sC').focus();
  m.querySelector('#sC').onclick=function(){ m.remove(); };
  m.querySelector('#sOk').onclick=function(){ m.remove(); doSubmit(false); };
}
var SUBMITTING=false;
function doSubmit(auto){
  if(SUBMITTING||!S.exam) return; SUBMITTING=true; clearInterval(TICK);
  var E=S.exam; loading(t('submitting'));
  api('submitExam',S.sid,E.responseId,E.answers,S.nick).then(function(r){
    SUBMITTING=false; store('exam',null); S.exam=null; S.result=r; if(auto) toast(t('timeUp')); go('result');
  }).catch(function(e){ SUBMITTING=false; toast(e.message||t('loadErr')); S.view='exam-run'; viewExamRun(); });
}
function bars(list, total, nameFn, flagLine){
  return list.map(function(x){
    var a=x.total?x.correct/x.total:null;
    return '<div class="metric"><div>'+esc(nameFn(x))+'</div><b>'+pct(a)+' <span class="muted" style="font-weight:400">('+x.correct+'/'+x.total+')</span></b><div class="bar '+(a!=null&&a>=S.cfg.passMark?'ok':'bad')+'" style="grid-column:1/-1"><i style="width:'+(a==null?0:Math.round(a*100))+'%"></i>'+(flagLine?'<span class="line" style="inset-inline-start:'+Math.round(flagLine*100)+'%"></span>':'')+'</div></div>';
  }).join('');
}
function viewResult(){
  var r=S.result; if(!r){ go('home'); return; }
  var filter=S.reviewFilter||'all';
  var h='<h1>'+esc(t('resultTitle'))+'</h1><p class="muted">'+esc(modeLabel(r.mode))+'</p>'+
    '<div class="grid g3"><div class="card" style="border-top:6px solid '+(r.passed?'var(--ok)':'var(--bad)')+'"><div class="muted">'+esc(t('score'))+'</div><div class="stat">'+pct(r.pct)+'</div><div>'+r.score+' / '+r.total+'</div><div style="margin-top:6px;font-weight:600;color:'+(r.passed?'var(--ok)':'var(--bad)')+'">'+esc(r.passed?t('passed'):t('notPassed'))+'</div></div>'+
    '<div class="card"><div class="muted">'+esc(t('time'))+'</div><div class="stat">'+Math.round(r.duration)+'</div><div>'+esc(t('minutes'))+'</div></div></div>';
  if(!r.valid) h+='<p class="muted" style="font-size:13px">'+esc(t('invalidNote'))+'</p>';
  h+='<div class="grid g3" style="margin-top:14px"><div class="card"><h3>'+esc(t('byDomain'))+'</h3>'+bars(r.byDomain,0,function(x){return x.domain+' · '+domName(x.domain);},S.cfg.passMark)+'</div><div class="card"><h3>'+esc(t('byApproach'))+'</h3>'+(r.byApproach&&r.byApproach.length?bars(r.byApproach,0,function(x){return apName(x.approach);},S.cfg.passMark):'<p class="muted">'+esc(t('none'))+'</p>')+'</div><div class="card"><h3>'+esc(t('byLevel'))+'</h3>'+(r.byLevel&&r.byLevel.length?bars(r.byLevel,0,function(x){return lvlName(x.level);},S.cfg.passMark):'<p class="muted">'+esc(t('none'))+'</p>')+'</div></div>';
  h+='<div class="card" style="margin-top:14px"><h3>'+esc(t('byLecture'))+'</h3>'+bars(r.byLecture.slice(0,6),0,function(x){return lecName(x.lecture,x.name);},S.cfg.passMark)+'</div>';
  h+='<h2>'+esc(t('review'))+'</h2><div class="row">'+[['all',t('all')],['wrong',t('wrongOnly')],['skip',t('skipped')]].map(function(f){return '<button class="btn small '+(filter===f[0]?'dark':'ghost')+'" data-f="'+f[0]+'">'+esc(f[1])+'</button>';}).join('')+'</div><div class="card white" style="margin-top:10px">';
  r.review.forEach(function(it,i){
    if(filter==='wrong'&&(it.correct||!it.selected)) return; if(filter==='skip'&&it.selected) return;
    h+='<div class="review-item"><div class="row"><b>'+(i+1)+'.</b> <span class="tag '+(it.correct?'ok':(it.selected?'bad':'skip'))+'">'+esc(it.correct?t('correct'):(it.selected?t('incorrect'):t('notAnswered')))+'</span><span class="spacer"></span><button class="btn ghost small" data-flag="'+esc(it.id)+'">⚑</button></div><div style="margin:6px 0">'+qMeta(it)+'</div><div class="qtext" style="font-size:16px">'+esc(it.text)+'</div>'+optsHtml({options:it.options},it.selected||null,{key:it.key})+'<div class="feedback '+(it.correct?'ok':'bad')+'"><b>'+esc(t('explanation'))+':</b> '+esc(it.explanation)+'</div></div>';
  });
  h+='</div><div class="row" style="margin-top:16px"><button class="btn" data-go="practice">'+esc(t('startPractice'))+'</button><button class="btn ghost" data-go="progress">'+esc(t('progress'))+'</button></div>';
  app().innerHTML=h; bindGo();
  app().querySelectorAll('[data-f]').forEach(function(b){ b.onclick=function(){ S.reviewFilter=b.getAttribute('data-f'); viewResult(); }; });
  app().querySelectorAll('[data-flag]').forEach(function(b){ b.onclick=function(){ flagDialog(b.getAttribute('data-flag')); }; });
}

/* ------------------------------------------------------------ progress */
function viewProgress(){
  loading();
  api('getProgress',S.sid).then(function(p){
    S.progress=p;
    var h='<h1>'+esc(t('progressTitle'))+'</h1><div class="grid g3"><div class="card"><div class="muted">'+esc(t('answered'))+'</div><div class="stat">'+p.answered+'</div></div><div class="card"><div class="muted">'+esc(t('accuracy'))+'</div><div class="stat">'+(p.answered?pct(p.correct/p.answered):'–')+'</div></div><div class="card"><div class="muted">'+esc(t('attempts'))+'</div><div class="stat">'+p.attempts.length+'</div></div></div>';
    h+='<div class="grid g2" style="margin-top:14px"><div class="card"><h3>'+esc(t('byDomain'))+'</h3>'+(p.byDomain.length?bars(p.byDomain,0,function(x){return x.domain+' · '+domName(x.domain);},S.cfg.passMark):'<p class="muted">'+esc(t('none'))+'</p>')+'</div>';
    h+='<div class="card"><h3>'+esc(t('byApproach'))+'</h3>'+(p.byApproach&&p.byApproach.length?bars(p.byApproach,0,function(x){return apName(x.approach);},S.cfg.passMark):'<p class="muted">'+esc(t('none'))+'</p>')+'</div>';
    h+='<div class="card"><h3>'+esc(t('byLevel'))+'</h3>'+(p.byLevel&&p.byLevel.length?bars(p.byLevel,0,function(x){return lvlName(x.level);},S.cfg.passMark):'<p class="muted">'+esc(t('none'))+'</p>')+'</div>';
    h+='<div class="card"><h3>'+esc(t('weakTopics'))+'</h3>'+(p.weak.length?bars(p.weak,0,function(x){return lecName(x.lecture,x.name);},S.cfg.passMark)+'<button class="btn small" id="weakBtn" style="margin-top:8px">'+esc(t('practiseWeak'))+'</button>':'<p class="muted">'+esc(t('none'))+'</p>')+'</div></div>';
    h+='<h2>'+esc(t('attempts'))+'</h2><div class="card white">'+(p.attempts.length?'<table><thead><tr><th>'+esc(t('date'))+'</th><th>'+esc(t('mode'))+'</th><th>'+esc(t('score'))+'</th><th>'+esc(t('time'))+'</th><th></th></tr></thead><tbody>'+p.attempts.map(function(a){return '<tr><td>'+esc(a.date.replace('T',' ').slice(0,16))+'</td><td>'+esc(modeLabel(a.mode))+'</td><td><b>'+pct(a.pct)+'</b> ('+a.score+'/'+a.total+')</td><td>'+Math.round(a.duration)+' '+esc(t('minutes'))+'</td><td><button class="btn ghost small" data-r="'+esc(a.responseId)+'">'+esc(t('view'))+'</button></td></tr>';}).join('')+'</tbody></table>':'<p class="muted">'+esc(t('noAttempts'))+'</p>')+'</div>';
    if(p.byLecture.length) h+='<h2>'+esc(t('byTopic'))+'</h2><div class="card">'+bars(p.byLecture,0,function(x){return lecName(x.lecture,x.name);},S.cfg.passMark)+'</div>';
    app().innerHTML=h;
    var wb=document.getElementById('weakBtn'); if(wb) wb.onclick=function(){ startPractice({weak:true,count:10}); };
    app().querySelectorAll('[data-r]').forEach(function(b){ b.onclick=function(){ loading(); api('getAttemptResult',S.sid,b.getAttribute('data-r')).then(function(r){ S.result=r; S.reviewFilter='all'; go('result'); }).catch(function(e){ toast(e.message); go('progress'); }); }; });
  }).catch(function(e){ app().innerHTML='<p>'+esc(e.message||t('loadErr'))+'</p>'; });
}

/* ------------------------------------------------------------ boot */
(function boot(){
  S.sid=store('token')||''; S.uid=store('uid')||''; store('sid',null);
  S.nick=store('nick')||''; S.lang=store('lang')||'en';
  document.body.setAttribute('dir',S.lang==='ar'?'rtl':'ltr');
  document.getElementById('brand').onclick=function(){ go('home'); };
  document.getElementById('brand').onkeydown=function(e){ if(e.key==='Enter') go('home'); };
  api('getConfig').then(function(c){
    S.cfg=c; document.getElementById('appName').textContent=c.appName; document.title=c.appName;
    if(c.logoUrl){ document.getElementById('markBox').outerHTML='<img src="'+esc(c.logoUrl)+'" alt="">'; }
    document.getElementById('foot').textContent=c.footer;
    var saved=store('exam'); if(saved){ S.exam=saved; }
    render();
  }).catch(function(e){ app().innerHTML='<div class="center"><div><h2>'+esc(e.message||'Error')+'</h2></div></div>'; });
})();
</script>
